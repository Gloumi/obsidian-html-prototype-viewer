name: Release Obsidian plugin

# Pushing a tag equal to the manifest version (e.g. `1.0.0`, no `v` prefix)
# builds the plugin and publishes the release with the assets Obsidian expects.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  # Required to sign build provenance for the release assets.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "$MANIFEST_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}" >&2
            exit 1
          fi

      # Lets users cryptographically verify that the published assets were
      # built from this repository, with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Idempotent: re-pushing an existing tag refreshes its assets instead of
      # failing on "a release with the same tag name already exists".
      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists — refreshing its assets."
            gh release upload "${GITHUB_REF_NAME}" \
              main.js manifest.json styles.css --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
